name: Update pharma news

on:
  workflow_dispatch:
  schedule:
    # UTC。3時間おき（JST 09/12/15/18/21/00/03/06 時）。
    - cron: "0 */3 * * *"

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

permissions:
  contents: write

concurrency:
  group: pharma-news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch RSS feeds
        id: fetch
        run: |
          set +e
          python scripts/fetch_news.py | tee fetch.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "failed_feeds=$(awk -F': ' '/^Failed feeds:/ {print $2}' fetch.log | tail -1)" >> "$GITHUB_OUTPUT"
          echo "articles=$(awk -F': ' '/^Articles collected:/ {print $2}' fetch.log | tail -1)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check websites
        id: watch
        run: |
          set +e
          python scripts/check_websites.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write status
        if: always()
        env:
          FETCH_EXIT_CODE: ${{ steps.fetch.outputs.exit_code }}
          WATCH_EXIT_CODE: ${{ steps.watch.outputs.exit_code }}
          FAILED_FEEDS: ${{ steps.fetch.outputs.failed_feeds }}
          ARTICLES: ${{ steps.fetch.outputs.articles }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          try:
              payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          except Exception:
              payload = {}

          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          fetch_exit = int(os.environ.get("FETCH_EXIT_CODE") or "1")
          watch_exit = int(os.environ.get("WATCH_EXIT_CODE") or "1")
          failed_feeds = int(os.environ.get("FAILED_FEEDS") or "0")

          if fetch_exit != 0 or watch_exit != 0:
              payload.update(state="error", message="更新失敗", last_failure_at=now)
          elif failed_feeds > 0:
              payload.update(
                  state="success",
                  message=f"更新成功（フィード{failed_feeds}件が取得失敗）",
                  last_success_at=now,
              )
          else:
              payload.update(state="success", message="更新成功", last_success_at=now)

          payload["article_count"] = int(os.environ.get("ARTICLES") or "0")
          payload["last_completed_at"] = now
          payload.setdefault("last_failure_at", "")
          payload.setdefault("last_success_at", "")
          payload["run_url"] = os.environ.get("RUN_URL") or os.environ.get("ACTIONS_URL", "")
          payload["updated_at"] = now

          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit results
        if: always()
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No generated-file changes to commit"
            exit 0
          fi
          git commit -m "chore: update pharma news data"
          git pull --rebase --autostash
          git push

      - name: Fail workflow if a step failed
        if: ${{ steps.fetch.outputs.exit_code != '0' || steps.watch.outputs.exit_code != '0' }}
        run: exit 1
